name: Codzienna Aktualizacja List TMDB

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja biblioteki requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Uruchomienie skryptu aktualizacji list
      env:
        TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        TMDB_ACCOUNT_ID: ${{ secrets.TMDB_ACCOUNT_ID }}
      run: python update_list.py
