name: Codzienna Aktualizacja List TMDB

on:
  schedule:
    # Uruchamia skrypt codziennie o godzinie 05:00 UTC (czyli 07:00 czasu polskiego w lecie / 06:00 w zimie)
    - cron: '0 5 * * *'
  workflow_dispatch: # Ta opcja pozwala na ręczne odpalenie skryptu w każdej chwili na GitHubie

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja biblioteki requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Uruchomienie skryptu aktualizacji list
      env:
        # Przekazanie bezpiecznych secretów z ustawień GitHuba do skryptu
        TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        TMDB_ACCOUNT_ID: ${{ secrets.TMDB_ACCOUNT_ID }}
      run: python update_list.py
